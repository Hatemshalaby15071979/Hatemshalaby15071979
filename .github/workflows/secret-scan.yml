name: Secret Scan (gitleaks)

# Branch policy: default branch is `master` (not `main`). This scan runs on PR
# diffs and on a weekly full-history schedule. Note: git history is not rewritten
# here; that requires the owner's explicit G2 authorization.
#
# Free secret scanning via gitleaks (no paid Secret Protection used).
# Especially important for this PUBLIC profile repository: scans the full
# history weekly to catch any accidentally-committed credentials, and scans
# PR diffs on every change.
#   - On pull_request: scan only the changed diff.
#   - On schedule / workflow_dispatch: scan the full history (--all).
on:
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: gitleaks (PR diff)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Blocking: fail the run when a secret is detected (was report-only).
          GITLEAKS_ARGS: --exit-code 1

      - name: gitleaks (full history)
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Blocking: fail the run when a secret is detected (was report-only).
          GITLEAKS_ARGS: --exit-code 1
          GITLEAKS_LOG_OPTS: --all
